name: test
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Run tests
        shell: bash
        run: make test
